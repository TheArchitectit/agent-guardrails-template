name: Guardrails per-build acceptance

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-build:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !github.event.deleted
    uses: TheArchitectit/agent-guardrails-template/.github/workflows/guardrails-build.yml@e9f49cf59e088d15e48c9e55fc2b84bb147a2418 # reusable workflow commit
    permissions:
      contents: read
      id-token: write
