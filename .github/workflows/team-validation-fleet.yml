name: Trusted Main Validation (UCS03 Podman)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrails-ucs03-main
  cancel-in-progress: false

jobs:
  validate-trusted-main:
    name: Trusted main validation
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, guardrails-ucs03]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage the example project
        run: cp .teams/fixtures/full-project.json .teams/example.json

      - name: Validate team sizes and status
        run: |
          python3 scripts/team_manager.py --project example validate-size
          python3 scripts/team_manager.py --project example status

      - name: Install Python test dependencies
        run: python3 -m pip install pytest pytest-cov

      - name: Run Python tests
        run: python3 -m pytest scripts/ -v --cov=scripts --cov-report=xml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: |
            mcp-server/go.sum
            cmd/team-cli/go.sum
            examples/go/go.sum

      - name: Run Go tests with race detection
        working-directory: mcp-server
        env:
          CGO_ENABLED: "1"
        run: go test ./... -v -race

      - name: Run Go tests (cmd/team-cli)
        working-directory: cmd/team-cli
        run: go test ./... -v -count=1

      - name: Run Go tests (examples/go)
        working-directory: examples/go
        run: go test ./... -v -count=1

      - name: Build MCP server
        working-directory: mcp-server
        run: go build ./...

      - name: Build team CLI
        working-directory: cmd/team-cli
        run: make build

      - name: Build Go examples (examples/go)
        working-directory: examples/go
        run: go build ./...

      # Spec 19 R19-12: nonzero test floor per Go module; zero tests or
      # missing discovery fails instead of passing silently.
      - name: Verify per-module test floor
        run: |
          set -euo pipefail
          INVENTORY=".guardrails/test-floor.json"
          mapfile -t ENTRIES < <(jq -c '.modules[]' "$INVENTORY")
          for entry in "${ENTRIES[@]}"; do
            path=$(jq -r '.path' <<< "$entry")
            min=$(jq -r '.min_tests' <<< "$entry")
            listing=$(cd "$path" && go test -list '^Test' ./...)
            # grep exits 1 on zero matches; that yields count=0, which the
            # floor comparison below then fails (deliberately fail-closed).
            count=$(printf '%s\n' "$listing" | grep -c '^Test' || true)
            echo "$path: discovered $count tests (floor: $min)"
            if [ "$count" -lt "$min" ]; then
              echo "::error::Module $path discovered $count tests, below the declared floor of $min"
              exit 1
            fi
          done
