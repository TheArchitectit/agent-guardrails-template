name: Trusted Main Validation (UCS03 Podman)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrails-ucs03-main
  cancel-in-progress: false

jobs:
  validate-trusted-main:
    name: Trusted main validation
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, guardrails-ucs03]
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Stage the example project
        run: cp .teams/fixtures/full-project.json .teams/example.json

      - name: Validate team sizes and status
        run: |
          python3 scripts/team_manager.py --project example validate-size
          python3 scripts/team_manager.py --project example status

      - name: Install Python test dependencies
        run: python3 -m pip install pytest pytest-cov pyyaml

      # Spec 19 R19-10: enumerate Python test suites from the tree rather than
      # hardcode a single pytest path. The discovery gate fails closed when a
      # collectable suite has no inventory row, so a new suite cannot escape the
      # trusted-lane Python run either.
      - name: Enforce Python test discovery (Spec 19 R19-10)
        run: |
          python3 scripts/check_python_tests.py --repo .
          python3 scripts/test_check_python_tests.py

      # Spec 19 R19-10 / R19-12: execute each enumerated suite with the command
      # the inventory declares and enforce its positive floor; zero collected
      # tests where a floor is declared fails instead of passing silently.
      - name: Run every enumerated Python test suite
        run: |
          set -euo pipefail
          INVENTORY=".guardrails/python-test-floor.json"
          mapfile -t ENTRIES < <(jq -c '.suites[]' "$INVENTORY")
          for entry in "${ENTRIES[@]}"; do
            path=$(jq -r '.path' <<< "$entry")
            min=$(jq -r '.min_tests' <<< "$entry")
            test_cmd=$(jq -r '.test_command' <<< "$entry")
            setup_cmd=$(jq -r '.setup_command // empty' <<< "$entry")

            echo "::group::$path"
            # A suite declares its own test dependencies so the runner does not
            # have to know any suite's imports in advance (R19-10).
            if [ -n "$setup_cmd" ]; then
              echo "setup: $setup_cmd"
              eval "$setup_cmd"
            fi
            echo "test:  $test_cmd"
            eval "$test_cmd"

            count=$(python3 -m pytest "$path" --collect-only -q -o addopts="" 2>/dev/null | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' | tail -1 || true)
            count=${count:-0}
            echo "$path: collected $count tests (floor: $min)"
            if [ "$count" -lt "$min" ]; then
              echo "::error::Suite $path collected $count tests, below the declared floor of $min"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: |
            mcp-server/go.sum
            cmd/team-cli/go.sum
            examples/go/go.sum

      # Spec 19 R19-10: enumerate modules from the repository rather than
      # assuming a go.work workspace (there is none). The discovery gate fails
      # closed when a go.mod in the tree has no inventory row, so a new module
      # cannot escape the trusted-lane test/build/floor run either.
      - name: Enforce Go module discovery (Spec 19 R19-10)
        run: |
          python3 scripts/check_go_modules.py --repo .
          python3 scripts/test_check_go_modules.py

      # Spec 19 R19-10: execute each enumerated module with the command the
      # inventory declares for it (test and build). Spec 19 R19-12: every
      # module also needs a discovered count at or above its declared positive
      # floor; zero tests or missing discovery fails instead of passing
      # silently. CGO_ENABLED=1 is set at the job level so the mcp-server race
      # command runs with cgo as before.
      - name: Test and build every enumerated Go module
        run: |
          set -euo pipefail
          INVENTORY=".guardrails/test-floor.json"
          mapfile -t ENTRIES < <(jq -c '.modules[]' "$INVENTORY")
          for entry in "${ENTRIES[@]}"; do
            path=$(jq -r '.path' <<< "$entry")
            min=$(jq -r '.min_tests' <<< "$entry")
            test_cmd=$(jq -r '.test_command' <<< "$entry")
            build_cmd=$(jq -r '.build_command' <<< "$entry")

            echo "::group::$path"
            echo "test:  $test_cmd"
            (cd "$path" && eval "$test_cmd")
            echo "build: $build_cmd"
            (cd "$path" && eval "$build_cmd")

            listing=$(cd "$path" && go test -list '^Test' ./...)
            # grep exits 1 on zero matches; that yields count=0, which the
            # floor comparison below then fails (deliberately fail-closed).
            count=$(printf '%s\n' "$listing" | grep -c '^Test' || true)
            echo "$path: discovered $count tests (floor: $min)"
            if [ "$count" -lt "$min" ]; then
              echo "::error::Module $path discovered $count tests, below the declared floor of $min"
              exit 1
            fi
            echo "::endgroup::"
          done

      # Spec 19 R19-13 clause 5, first half: measure THIS host. The static gate
      # (regression-guard.yml) reads the YAML and proves the job definition is
      # repo-scoped; only a probe running here can show what the host actually
      # looks like. The record is written outside the checkout so it does not
      # become the residue the next run has to clean up. A violated property
      # fails the job — an isolation claim with no measurement behind it is the
      # thing the requirement forbids.
      - name: Runner isolation probe (Spec 19 R19-13)
        run: |
          set -euo pipefail
          python3 scripts/runner_isolation_probe.py \
            --workspace "$GITHUB_WORKSPACE" \
            --sha "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --out "$RUNNER_TEMP/runner-isolation.json"

      # Spec 19 R19-13 clause 5, second half: the recorded attestation must be
      # well-formed and must agree that no property was violated. Running the
      # gate in `--attestation` mode means the record is validated by the same
      # code that reads the definitions, so the two cannot drift apart.
      - name: Validate runner isolation attestation (Spec 19 R19-13)
        run: |
          set -euo pipefail
          python3 scripts/check_runner_isolation.py \
            --repo . \
            --attestation "$RUNNER_TEMP/runner-isolation.json"

      # Spec 19 R19-13: post-job cleanup is part of the isolation contract, not
      # housekeeping. The UCS03 pool is a persistent host, so a failed or
      # cancelled run would otherwise leave a staged fixture, an exported file
      # or a build output for the next run — and the next run may be a different
      # commit. This runs unconditionally and last, so it cleans up after the
      # work rather than before it.
      - name: Post-job cleanup (Spec 19 R19-13)
        if: always()
        run: |
          set -euo pipefail
          rm -f .teams/example.json teams-export.json
          rm -f "${RUNNER_TEMP:-/tmp}/runner-isolation.json"
          echo "workspace-local artifacts removed"
