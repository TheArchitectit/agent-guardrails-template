name: Secret Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  scan-for-secrets:
    name: Scan for Leaked Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  check-env-files:
    name: Check for .env Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for .env files
        run: |
          echo "Checking for accidentally committed .env files..."

          # Find .env files (excluding .env.example)
          ENV_FILES=$(find . -name ".env*" ! -name ".env.example" ! -name ".env.template" -type f 2>/dev/null || true)

          if [ -n "$ENV_FILES" ]; then
            echo "ERROR: Found .env files that should not be committed:"
            echo "$ENV_FILES"
            echo ""
            echo "Please remove these files and add them to .gitignore"
            exit 1
          else
            echo "No .env files found (good!)"
          fi

      - name: Check for credential files
        run: |
          echo "Checking for credential files..."

          # Narrow synthetic-fixture allowlist (Spec 19 R19-06). Entries are
          # exact repo-relative paths of files that contain ONLY unmistakably
          # synthetic credentials, with a justification comment per entry.
          # See .guardrails/secret-scan-allowlist.txt for the rules.
          ALLOWLIST=".guardrails/secret-scan-allowlist.txt"
          mapfile -t ALLOWED < <([ -f "$ALLOWLIST" ] && grep -vE '^[[:space:]]*(#|$)' "$ALLOWLIST")

          # List of patterns that might contain secrets
          PATTERNS=(
            "*.pem"
            "*.key"
            "*credentials*.json"
            "*secrets*.json"
            "*service-account*.json"
          )

          FOUND_FILES=""
          for pattern in "${PATTERNS[@]}"; do
            FILES=$(find . -name "$pattern" -type f 2>/dev/null || true)
            if [ -n "$FILES" ]; then
              FOUND_FILES="$FOUND_FILES$FILES"$'\n'
            fi
          done

          # Blocking: anything not explicitly allowlisted fails the step.
          FAILING=""
          if [ -n "$FOUND_FILES" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              rel="${file#./}"
              allowed=0
              for a in "${ALLOWED[@]:-}"; do
                if [ "$rel" = "$a" ]; then
                  allowed=1
                  echo "Allowlisted synthetic fixture (not a failure): $rel"
                  break
                fi
              done
              if [ "$allowed" -ne 1 ]; then
                FAILING="$FAILING$rel"$'\n'
              fi
            done <<< "$FOUND_FILES"
          fi

          if [ -n "$FAILING" ]; then
            echo "ERROR: Found credential files that are not allowlisted synthetic fixtures:"
            echo "$FAILING"
            echo ""
            echo "Remove the files, or if (and only if) a file is a synthetic fixture with fake credentials,"
            echo "add its exact repo-relative path with a justification comment to $ALLOWLIST."
            exit 1
          fi

          echo "No non-allowlisted credential files found (good!)"

  check-hardcoded-secrets:
    name: Check for Hardcoded Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for common secret patterns
        run: |
          echo "Checking for hardcoded secrets..."

          # Narrow synthetic-fixture allowlist (Spec 19 R19-06): exclude each
          # allowlisted file by name from the recursive scan. The allowlist
          # file documents the exact paths and their justifications.
          ALLOWLIST=".guardrails/secret-scan-allowlist.txt"
          ALLOW_ARGS=()
          if [ -f "$ALLOWLIST" ]; then
            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              ALLOW_ARGS+=(--exclude="$(basename "$entry")")
            done < <(grep -vE '^[[:space:]]*(#|$)' "$ALLOWLIST")
          fi

          # Patterns that might indicate hardcoded secrets
          PATTERNS=(
            "password\s*=\s*['\"]"
            "api_key\s*=\s*['\"]"
            "secret\s*=\s*['\"]"
            "token\s*=\s*['\"]"
            "aws_access_key_id\s*=\s*['\"]"
            "private_key\s*=\s*['\"]"
          )

          ISSUES_FOUND=0

          for pattern in "${PATTERNS[@]}"; do
            # Search in common code files, excluding test fixtures
            MATCHES=$(grep -riE "$pattern" --include="*.py" --include="*.js" --include="*.ts" --include="*.yaml" --include="*.yml" --include="*.json" "${ALLOW_ARGS[@]}" . 2>/dev/null | grep -v "node_modules" | grep -v ".example" | grep -v "test_fixtures" || true)

            if [ -n "$MATCHES" ]; then
              echo "FAIL: Hardcoded secret pattern ($pattern) found in:"
              echo "$MATCHES"
              echo ""
              ISSUES_FOUND=$((ISSUES_FOUND + 1))
            fi
          done

          # Blocking: a finding cannot be dismissed with a warning.
          if [ $ISSUES_FOUND -gt 0 ]; then
            echo "::error::Found $ISSUES_FOUND hardcoded secret pattern(s)."
            echo "Remove the secret, or if (and only if) a match is an unmistakably synthetic fixture,"
            echo "add its exact repo-relative path with a justification comment to $ALLOWLIST."
            exit 1
          fi

          echo "No obvious hardcoded secrets found (good!)"
