name: Documentation Standards Check

# Spec 19 R19-11 requires the documentation gate to run on PR *and* on protected
# push/release events. Before this change the workflow was PR-only and
# path-filtered to `docs/**` and `*.md`, so a push to `main` never ran the
# link check or the 500-line cap at all — and the tree carried 15 files over the
# cap that had never once been measured. The push trigger below is deliberately
# UNFILTERED: a path filter may not let a changed documentation dependency
# escape validation (R19-14).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-doc-length:
    name: Document line cap (500) and exemptions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The cap is a Python gate, not an inline shell loop: it is fail-closed on
      # an empty scan, requires a scope + written reason for every exemption,
      # and rejects a stale exemption (a file that is exempt but no longer over
      # the cap, or no longer exists). The inline loop it replaces could not tell
      # "everything is within the cap" apart from "I found nothing".
      - name: Markdown 500-line cap (Spec 19 R19-11)
        run: python3 scripts/check_doc_length.py .

      # Red-on-drift control: the gate must be able to fail. Runs the gate's own
      # mutation fixtures so a green result cannot come from an assertion that
      # never executes.
      - name: Line-cap gate self-test (red-on-drift)
        run: python3 scripts/test_check_doc_length.py

  check-broken-links:
    name: Internal Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # scripts/check-doc-links.sh is the single source of truth: the CI job and
      # the mutation-kill harness (internal/mutationkill) both invoke it, so the
      # control they exercise is the same one that blocks a merge.
      - name: Internal link check (Spec 19 R19-11)
        run: bash scripts/check-doc-links.sh .

  check-required-sections:
    name: Check Required Sections
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check for required sections
        run: |
          echo "Checking for required sections in documentation..."
          echo ""

          WARNINGS=""

          # Check docs/ files for required sections
          for file in $(find docs -name "*.md" -type f 2>/dev/null || true); do
            # Skip INDEX files (different structure)
            if [[ "$file" == *"INDEX.md" ]]; then
              continue
            fi

            # Check for Overview section
            if ! grep -q "^## Overview" "$file"; then
              WARNINGS="$WARNINGS$file: Missing '## Overview' section"$'\n'
            fi

            # Check for Last Updated
            if ! grep -q "Last Updated:" "$file"; then
              WARNINGS="$WARNINGS$file: Missing 'Last Updated:' footer"$'\n'
            fi
          done

          if [ -n "$WARNINGS" ]; then
            echo "Advisory only (not a release gate):"
            echo "$WARNINGS"
          else
            echo "All required sections present."
          fi

  check-trailing-whitespace:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check for trailing whitespace
        run: |
          echo "Checking for trailing whitespace (advisory only)..."

          FILES_WITH_TRAILING=$(find . -name "*.md" -type f | xargs grep -l " $" 2>/dev/null | grep -v node_modules || true)

          if [ -n "$FILES_WITH_TRAILING" ]; then
            echo "Files with trailing whitespace:"
            echo "$FILES_WITH_TRAILING"
          else
            echo "No trailing whitespace found."
          fi
