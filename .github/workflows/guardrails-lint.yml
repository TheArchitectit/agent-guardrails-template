name: Guardrails Compliance Check

# Spec 19 R19-14: this workflow previously ran ONLY on `pull_request`, was
# branch-filtered to `main`/`develop`, and computed its change set with
#
#     CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null \
#                     || git diff --name-only HEAD~1)
#
# Three defects, all in that one line:
#
#   1. No protected push ever ran these rows. `pull_request` alone means a
#      direct push to `main` was never audited — the same class of gap the
#      documentation gate carried until 2026-10-18.
#   2. The base ref was hardcoded to `origin/main` while the workflow also ran
#      on `develop`, so a `develop` PR was compared against the wrong branch.
#   3. `|| git diff --name-only HEAD~1` is a *narrowing* fallback: when the real
#      diff fails (missing ref, shallow checkout, filter error) it scans the tip
#      commit only and still reports green. R19-14 says a filter error or a
#      missing diff is NOT_RUN/FAIL, not an automatic skip.
#
# The change set is now derived from the event, and a diff failure fails the job.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-scope-boundaries:
    name: Check Change Scope
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Analyze changed files
        env:
          # `changed_files.sh` / `changed_commits.sh` derive the range from the
          # event. Without BEFORE_SHA a push event has no base and the script
          # refuses rather than reporting an empty change set as clean.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_SHA: ${{ github.sha }}
        run: |
          echo "Analyzing scope of changes (event: $EVENT_NAME)..."
          echo ""
          CHANGED_FILES=$(scripts/changed_files.sh)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          DOC_CHANGES=$(echo "$CHANGED_FILES" | grep -E "\.md$|docs/" | wc -l || echo "0")
          CODE_CHANGES=$(echo "$CHANGED_FILES" | grep -E "\.(py|js|ts|go|rs|java)$" | wc -l || echo "0")
          CONFIG_CHANGES=$(echo "$CHANGED_FILES" | grep -E "\.(json|yaml|yml|toml)$" | wc -l || echo "0")
          WORKFLOW_CHANGES=$(echo "$CHANGED_FILES" | grep -E "\.github/workflows" | wc -l || echo "0")

          echo "Change summary:"
          echo "  Documentation: $DOC_CHANGES files"
          echo "  Code: $CODE_CHANGES files"
          echo "  Config: $CONFIG_CHANGES files"
          echo "  Workflows: $WORKFLOW_CHANGES files"
          echo ""

          TOTAL_FILES=$(echo "$CHANGED_FILES" | wc -l)
          if [ "$TOTAL_FILES" -gt 20 ]; then
            echo "WARNING: Large change scope ($TOTAL_FILES files)"
            echo "Consider splitting into smaller PRs for easier review."
          fi

  check-forbidden-files:
    name: Check for Forbidden Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check for forbidden file changes
        env:
          # `changed_files.sh` / `changed_commits.sh` derive the range from the
          # event. Without BEFORE_SHA a push event has no base and the script
          # refuses rather than reporting an empty change set as clean.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_SHA: ${{ github.sha }}
        run: |
          # The matcher is a script, not an inline `grep -E` over glob patterns.
          # The previous loop passed "*.pem" to an ERE engine (grep warns
          # "* at start of expression" — undefined behaviour) and treated ".env"
          # as "any char + env", so it refused docs/.env.example, the very file
          # its own message recommends. See scripts/check_forbidden_files.py.
          scripts/changed_files.sh > changed-paths.txt
          python3 scripts/check_forbidden_files.py --paths-file changed-paths.txt
          python3 scripts/test_check_forbidden_files.py

  validate-commit-messages:
    name: Validate Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check commit message format
        env:
          # `changed_files.sh` / `changed_commits.sh` derive the range from the
          # event. Without BEFORE_SHA a push event has no base and the script
          # refuses rather than reporting an empty change set as clean.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_SHA: ${{ github.sha }}
        run: |
          echo "Validating commit messages..."
          echo ""
          COMMITS=$(scripts/changed_commits.sh --format "%h %s")
          echo "Commits to validate:"
          echo "$COMMITS"
          echo ""

          VALID_TYPES="feat|fix|docs|style|refactor|perf|test|chore|security|build|ci"
          INVALID_COMMITS=""

          while IFS= read -r line; do
            [ -n "$line" ] || continue
            HASH=$(echo "$line" | cut -d' ' -f1)
            MSG=$(echo "$line" | cut -d' ' -f2-)
            if ! echo "$MSG" | grep -qE "^($VALID_TYPES)(\(.+\))?: .+"; then
              if ! echo "$MSG" | grep -qE "^Merge "; then
                INVALID_COMMITS="$INVALID_COMMITS$HASH: $MSG"$'\n'
              fi
            fi
          done <<< "$COMMITS"

          if [ -n "$INVALID_COMMITS" ]; then
            echo "INVALID COMMIT MESSAGES:"
            echo "$INVALID_COMMITS"
            echo ""
            echo "Commit messages should follow conventional commit format:"
            echo "  type(scope): description"
            echo ""
            echo "Valid types: $VALID_TYPES"
            echo ""
            echo "Examples:"
            echo "  feat(auth): add OAuth2 support"
            echo "  fix(parser): handle null input"
            echo "  docs(readme): update installation steps"
            # Warning only, not failing
          else
            echo "All commit messages follow conventional format."
          fi

  check-ai-attribution:
    name: Check AI Attribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check for AI Attribution
        env:
          # `changed_files.sh` / `changed_commits.sh` derive the range from the
          # event. Without BEFORE_SHA a push event has no base and the script
          # refuses rather than reporting an empty change set as clean.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_SHA: ${{ github.sha }}
        run: |
          echo "Checking for AI attribution..."
          echo ""
          COMMIT_BODIES=$(scripts/changed_commits.sh --format "%B---COMMIT_SEP---")
          AI_KEYWORDS="Claude|GPT|Gemini|AI|LLM|Copilot|agent"
          MISSING_ATTRIBUTION=""

          while IFS= read -r commit; do
            [ -n "$commit" ] || continue
            if echo "$commit" | grep -qiE "$AI_KEYWORDS"; then
              if ! echo "$commit" | grep -qi "Authored by TheArchitectit"; then
                MISSING_ATTRIBUTION="$MISSING_ATTRIBUTION- Commit may need AI attribution"$'\n'
              fi
            fi
          done <<< "$(echo "$COMMIT_BODIES" | tr '---COMMIT_SEP---' '\n')"

          if [ -n "$MISSING_ATTRIBUTION" ]; then
            echo "NOTE: Some commits may need AI attribution:"
            echo "$MISSING_ATTRIBUTION"
            echo ""
            echo "If AI assisted with these commits, add:"
            echo "  Authored by TheArchitectit"
          else
            echo "Attribution check complete."
          fi

  guardrails-summary:
    name: Generate Compliance Summary
    runs-on: ubuntu-latest
    needs: [check-scope-boundaries, check-forbidden-files, validate-commit-messages, check-ai-attribution]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Guardrails Compliance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Scope Boundaries | ${{ needs.check-scope-boundaries.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Forbidden Files | ${{ needs.check-forbidden-files.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit Messages | ${{ needs.validate-commit-messages.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AI Attribution | ${{ needs.check-ai-attribution.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See [Agent Guardrails](docs/AGENT_GUARDRAILS.md) for compliance requirements." >> $GITHUB_STEP_SUMMARY
