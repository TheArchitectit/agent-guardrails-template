name: Team Validation

on:
  # Protected-branch pushes run the same security rows so a merge cannot land
  # without the negative-control matrix passing on a supported runner.
  push:
    branches: [main, master]
  # Pull requests, including forks, stay on GitHub-hosted runners so
  # untrusted contribution code never runs inside the private UCS03 network.
  pull_request:
    branches: [main, master]
  # Manual runs on arbitrary refs also stay on the hosted runner.
  workflow_dispatch:

jobs:
  validate-teams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Stage the example project
        run: |
          # The CLI resolves projects to .teams/<project>.json. Use the
          # full-project fixture so validate-size runs against realistic,
          # fully-staffed teams instead of an unpopulated project (which is
          # undersized by design and would fail every CI run).
          cp .teams/fixtures/full-project.json .teams/example.json

      - name: Validate team sizes
        run: |
          python3 scripts/team_manager.py --project example validate-size

      - name: Check team status
        run: |
          python3 scripts/team_manager.py --project example status

      - name: Export team configuration
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/team_manager.py --project example export-json --file teams-export.json

      - name: Upload team export
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teams-export
          path: teams-export.json

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run Python tests
        run: |
          pytest scripts/ -v --cov=scripts --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
        with:
          files: ./coverage.xml

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            mcp-server/go.sum
            cmd/team-cli/go.sum
            examples/go/go.sum

      - name: Run Go tests (mcp-server)
        run: |
          cd mcp-server
          go test ./... -v -race

      - name: Run Go tests (cmd/team-cli)
        run: |
          cd cmd/team-cli
          go test ./... -v -count=1

      - name: Run Go tests (examples/go)
        run: |
          cd examples/go
          go test ./... -v -count=1

      - name: Build Go handlers (mcp-server)
        run: |
          cd mcp-server
          go build ./...

      - name: Build Go examples (examples/go)
        run: |
          cd examples/go
          go build ./...

      # Spec 19 R19-12: every Go module needs a discovered count at or above
      # its declared positive floor in .guardrails/test-floor.json. Zero tests
      # or missing discovery is a failure, never an implicit green default.
      - name: Verify per-module test floor
        run: |
          set -euo pipefail
          INVENTORY=".guardrails/test-floor.json"
          mapfile -t ENTRIES < <(jq -c '.modules[]' "$INVENTORY")
          for entry in "${ENTRIES[@]}"; do
            path=$(jq -r '.path' <<< "$entry")
            min=$(jq -r '.min_tests' <<< "$entry")
            listing=$(cd "$path" && go test -list '^Test' ./...)
            # grep exits 1 on zero matches; that yields count=0, which the
            # floor comparison below then fails (deliberately fail-closed).
            count=$(printf '%s\n' "$listing" | grep -c '^Test' || true)
            echo "$path: discovered $count tests (floor: $min)"
            if [ "$count" -lt "$min" ]; then
              echo "::error::Module $path discovered $count tests, below the declared floor of $min"
              exit 1
            fi
          done

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - name: Build CLI
        run: |
          cd cmd/team-cli
          make build

      - name: Upload CLI binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: team-cli
          path: cmd/team-cli/team

  # ---------------------------------------------------------------------------
  # Spec 19 Phase 0 security matrix (SPRINT-A4). One job per row gives a stable,
  # required-check name. Rows are added ONLY for suites that exist and pass;
  # every row drives the real middleware/endpoint, not a helper call. Suites not
  # yet implemented stay documented as NOT_RUN in
  # docs/sprints/SPRINT-A4-ci-security-gates.md rather than being faked here.
  # ---------------------------------------------------------------------------

  # R19-03 / R19-05: web middleware fail-closed on a configured-invalid
  # registry, plus registered/legacy authorization on the real REST surface.
  security-matrix-web-failclosed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Web fail-closed middleware + REST authorization row
        run: |
          cd mcp-server
          go test ./internal/web -run 'TestRegistryConfiguredInvalidDeniesAllProtectedTraffic|TestAPIKeyAuth' -count=1 -v

  # R19-03: MCP negative controls over the real StreamableHTTP endpoint
  # (allow AND deny + zero side effect) and the live revocation-propagation
  # bound driven through both the web and MCP httptest paths.
  security-matrix-mcp-fullpath-authz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: MCP full-path authz + live revocation bound row
        run: |
          cd mcp-server
          go test ./internal/mcp -run 'TestStreamableHTTP|TestLiveRevocationPropagationBound' -count=1 -v

  # R19-05: credential registry fail-closed and lifecycle rows.
  security-matrix-registry-failclosed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Registry fail-closed + lifecycle row
        run: |
          cd mcp-server
          go test ./internal/auth -run 'TestRegistry|TestRevocation|TestPermitsRestrictedOnly|TestSecretFile' -count=1 -v

  # R19-06: secret-leak / redaction row. Drives real paths (guardrail://config
  # resource read, an authorized tool call that persists a real audit decision,
  # and a denied error response) with a canary secret planted in every
  # secret-bearing config field and in tool arguments, and asserts the canary
  # never appears in logs, audit records, error responses, or serialized output.
  security-matrix-secret-redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Secret-leak / redaction row
        run: |
          cd mcp-server
          go test ./internal/mcp -run 'TestSecretLeakRedactionAcrossRealPaths|TestArgumentPrivacy|TestGuardrailConfigOmitsSecrets|TestConfigPublicViewOmitsSecrets|TestSafeResourceIDRejectsSecrets' -count=1 -v

  # R19-07: webhook SSRF row. The dispatcher POSTs to the stored URL, so the
  # configuration-time URL guard must reject loopback, link-local (including
  # cloud metadata 169.254.169.254 and IPv4-mapped forms), private, and
  # unique-local destinations, and non-http(s) schemes, while accepting public
  # https. A policy-denied destination is the failed outcome.
  security-matrix-webhook-ssrf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Webhook URL SSRF guard row
        run: |
          cd mcp-server
          go test ./internal/mcp -run 'TestValidateWebhookURL' -count=1 -v

  # R19-08: client-IP trust boundary row (Spec 12 §3.4). With TRUSTED_PROXIES
  # unset the socket peer is the client IP and a forged X-Forwarded-For/
  # X-Real-IP/Forwarded header must not change the rate-limit key; a peer inside
  # a configured CIDR may supply the client IP; a malformed TRUSTED_PROXIES
  # entry fails config validation closed. Every assertion drives the real Echo
  # IPExtractor / config.Validate, not a helper call.
  security-matrix-clientip-trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Client-IP trust boundary row
        run: |
          cd mcp-server
          go test ./internal/clientip ./internal/web ./internal/config -run 'TestDefaultTrustsNoProxy|TestTrustedPeerHonoursForwarded|TestBareIPEntryTrusted|TestMalformedEntryFailsClosed|TestRateLimitKeyIgnoresForgedForwardedHeaders|TestTrustedProxyPeerUsesForwardedHeader|TestForwardedHeaderAnomalyMiddlewarePassesThrough|TestValidateTrustedProxiesStance' -count=1 -v

  # R19-08 (deployment/readiness half) / Spec 18 R18-07..R18-13: ordered
  # readiness and lifecycle contract. Every assertion drives the real ordered
  # evaluator and the real /health/ready handler: the checks run in the declared
  # order; STARTING/DRAINING/STOPPED are non-ready; a required probe that cannot
  # run is NOT_RUN (never PASS); a configured-but-invalid registry is non-ready
  # while an absent registry is skipped; a disabled or unexercised policy engine
  # is never an enforcement PASS; and evidence carries only bounded reason codes.
  security-matrix-readiness-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Readiness and lifecycle row
        run: |
          cd mcp-server
          go test ./internal/web -run 'TestReadinessReadyWhenAllChecksPass|TestLivenessIsLocalAndReadinessGatesTraffic|TestMissingProbeIsNotRunNeverPass|TestRegistryFailClosedButAbsentIsSkipped|TestPolicyHonesty|TestLifecycleDrainingAndStoppedAreNonReady|TestReadinessEvidenceIsBounded|TestHealthReadyHandlerStatusCodes' -count=1 -v

  # R19-08 / Spec 12 §3.3.2 + §3.3.4: CORS posture row. Production
  # wildcard/empty origins are a hard error, never a substitution
  # (EffectiveCORSOrigins); non-production substitutes restrictive localhost
  # defaults and reports the substitution. A CORS preflight is answered for a
  # DECLARED route only — an OPTIONS request whose matched route is the
  # catch-all file/SPA fallback is refused (404), so OPTIONS cannot declare an
  # arbitrary path. Every assertion drives the real router + middleware chain.
  security-matrix-cors-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: CORS posture and declared-preflight row
        run: |
          cd mcp-server
          go test ./internal/config ./internal/web -run 'TestEffectiveCORSOrigins|TestEffectiveCORSOriginsDoesNotAliasCaller|TestPreflightDeclaredRouteOnly|TestPreflightGuardLeavesNonOptionsUntouched' -count=1 -v

  # R19-08 / Spec 12 §3.1: declared exposure registry row. Every registered
  # route is enumerated from the REAL route table and must map to exactly one
  # exposure class; a route not declared public is authenticated (deny by
  # default); APIKeyAuth and RateLimitMiddleware derive their skip set from the
  # same registry; the static-asset rule stays method- and prefix-constrained.
  security-matrix-exposure-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Declared exposure registry row
        run: |
          cd mcp-server
          go test ./internal/web -run 'TestExposureRegistry' -count=1 -v

  # Spec 16 R16-01/R16-04: declared resource permission matrix row. Proves every
  # registered guardrail:// resource has exactly one declared permission row
  # (matrix cannot fall behind the registry), that an undeclared resource denies,
  # and that a resource read is authorized by the same principal decision model
  # as a tool call over the real StreamableHTTP endpoint (allow AND deny).
  security-matrix-resource-permission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Resource permission matrix + per-resource authorization row
        run: |
          cd mcp-server
          go test ./internal/mcp -run 'TestResourcePolicyMatrixCoversEveryRegisteredResource|TestStreamableHTTPResourceReadAuthorization|TestAuthorizeResourceReadDeniesWithoutPrincipal' -count=1 -v

  # Spec 11 §4.5.2 / acceptance criterion 8: the legacy-acceptance removal
  # switch is testable on both transports. Before the deadline the legacy
  # shared key keeps its surface; once the deadline has passed it is refused
  # while a registered credential is unaffected; a malformed deadline fails
  # closed. Also proves accepted legacy use is counted (migration measured,
  # not assumed).
  security-matrix-legacy-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Legacy-acceptance removal switch row
        run: |
          cd mcp-server
          go test ./internal/config -run 'TestLegacyAcceptance|TestValidateRejectsMalformedLegacyDeadline' -count=1 -v
          go test ./internal/web -run 'TestAPIKeyAuth_LegacyAcceptanceRemovalSwitch' -count=1 -v
          go test ./internal/mcp -run 'TestRequireBearerWithPolicyLegacyRemovalSwitch' -count=1 -v

  # Spec 12 §3.6 / Spec 17 R17-03: security-headers row. Drives the real
  # middleware chain and asserts the deprecated X-XSS-Protection header is
  # never emitted, the headers that do the work are present, and HSTS is
  # emitted ONLY for a verified public HTTPS origin (TLS enabled + profile
  # `public`) — a header asserting an undeclared posture fails the row.
  security-matrix-security-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Security headers + HSTS posture row
        run: |
          cd mcp-server
          go test ./internal/web -run 'TestSecurityHeaders' -count=1 -v
          go test ./internal/config -run 'TestEmitsHSTS|TestHSTSHeaderValueIsBounded' -count=1 -v

  # Spec 17 R17-04: storage transit posture row. Proves DB/Redis transit is
  # coupled to the effective deployment profile — outside the isolated local
  # boundary a plaintext or unverified posture fails startup (verify-full DB,
  # Redis TLS required), while local keeps the isolated-bridge exception.
  security-matrix-storage-transit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Storage transit posture row
        run: |
          cd mcp-server
          go test ./internal/config -run 'TestValidateStorageTransit|TestValidateCouplesStorageTransitToProfile' -count=1 -v

  # Spec 17 R17-05: outside the local boundary, a production/nonlocal
  # deployment must reject known placeholder/default credentials (the shipped
  # Compose fallback is not a production credential).
  security-matrix-default-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Default-credential rejection row
        run: |
          cd mcp-server
          go test ./internal/config -run 'TestIsPlaceholderCredential|TestValidateNoProductionDefaultCredentials|TestValidateCouplesDefaultCredentialGateToProfile' -count=1 -v

  # Spec 17 R17-06: each primary secret (MCP/IDE key, JWT signing material,
  # DB/Redis password) may come from a read-only mounted secret file instead of
  # the environment, the file read is restricted to the service identity, and a
  # missing/permissive/empty file fails startup rather than starting with no
  # credential. The resolved value must still flow through the existing gates.
  security-matrix-secret-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Secret-source row
        run: |
          cd mcp-server
          go test ./internal/secretfile ./internal/config -run 'TestPermitsRestrictedOnly|TestReadAcceptsRestrictedFile|TestReadRejectsNonRegularAndPermissive|TestResolveSecretSourcesFromFiles|TestResolveSecretSourcesInlineWins|TestResolveSecretSourcesFailsClosed|TestValidateRequiresASecretSource|TestSecretFileSourceFeedsTheExistingGates' -count=1 -v

  # R19-04: mutation-kill control. Copies the module to a scratch directory,
  # confirms the real negative suite PASSES, injects a deterministic bypass
  # (webhook SSRF guard always permits; webhook egress policy always permits;
  # registry fail-closed swallows the load error; auth check always permits;
  # MCP tools/call always authorizes; secret fixture leaks into output; client
  # IP stance trusts every peer; readiness lifecycle gate removed; required
  # readiness probe failure swallowed; exposure registry always public;
  # exposure asset rule /api/ exclusion removed; HSTS emitted for a
  # non-public origin; resource-read authorization always permits; the
  # legacy-acceptance removal switch ignored; the default-credential gate always
  # permits; the secret-source requirement always satisfied), and requires
  # the SAME suite to FAIL —
  # proving the control detects the bypass. The scratch copy means the protected
  # tree is never left mutated. The docs-gate control runs the real link checker
  # (scripts/check-doc-links.sh) against a scratch tree and requires a broken
  # internal Markdown link to flip it PASS->FAIL.
  security-matrix-mutation-kill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Mutation-kill control row
        run: |
          cd mcp-server
          go test ./internal/mutationkill -count=1 -v
