name: Team Validation

on:
  # Protected-branch pushes run the same security rows so a merge cannot land
  # without the negative-control matrix passing on a supported runner.
  push:
    branches: [main, master]
  # Pull requests, including forks, stay on GitHub-hosted runners so
  # untrusted contribution code never runs inside the private UCS03 network.
  pull_request:
    branches: [main, master]
  # Manual runs on arbitrary refs also stay on the hosted runner.
  workflow_dispatch:

jobs:
  validate-teams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Stage the example project
        run: |
          # The CLI resolves projects to .teams/<project>.json. Use the
          # full-project fixture so validate-size runs against realistic,
          # fully-staffed teams instead of an unpopulated project (which is
          # undersized by design and would fail every CI run).
          cp .teams/fixtures/full-project.json .teams/example.json

      - name: Validate team sizes
        run: |
          python3 scripts/team_manager.py --project example validate-size

      - name: Check team status
        run: |
          python3 scripts/team_manager.py --project example status

      - name: Export team configuration
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/team_manager.py --project example export-json --file teams-export.json

      - name: Upload team export
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teams-export
          path: teams-export.json

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov

      # Spec 19 R19-10: enumerate Python test suites from the repository rather
      # than hardcoding a single pytest path, so a new suite (a nested tool, an
      # examples/ suite) cannot silently escape the Python test run. The
      # discovery gate is fail-closed: every directory holding a collectable
      # test_*.py / *_test.py MUST have a row in
      # .guardrails/python-test-floor.json and every row MUST name an existing
      # suite.
      - name: Enforce Python test discovery (Spec 19 R19-10)
        run: |
          python3 scripts/check_python_tests.py --repo .
          python3 scripts/test_check_python_tests.py

      # Spec 19 R19-10 / R19-12: execute each enumerated suite with the command
      # the inventory declares and fail when a suite collects fewer tests than
      # its declared positive floor. Zero collected tests where a floor is
      # declared is non-releaseable, never an implicit green default.
      - name: Run every enumerated Python test suite
        run: |
          set -euo pipefail
          INVENTORY=".guardrails/python-test-floor.json"
          mapfile -t ENTRIES < <(jq -c '.suites[]' "$INVENTORY")
          for entry in "${ENTRIES[@]}"; do
            path=$(jq -r '.path' <<< "$entry")
            min=$(jq -r '.min_tests' <<< "$entry")
            test_cmd=$(jq -r '.test_command' <<< "$entry")
            setup_cmd=$(jq -r '.setup_command // empty' <<< "$entry")

            echo "::group::$path"
            # A suite declares its own test dependencies so the runner does not
            # have to know any suite's imports in advance (R19-10).
            if [ -n "$setup_cmd" ]; then
              echo "setup: $setup_cmd"
              eval "$setup_cmd"
            fi
            echo "test:  $test_cmd"
            eval "$test_cmd"

            count=$(python3 -m pytest "$path" --collect-only -q -o addopts="" 2>/dev/null | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' | tail -1 || true)
            count=${count:-0}
            echo "$path: collected $count tests (floor: $min)"
            if [ "$count" -lt "$min" ]; then
              echo "::error::Suite $path collected $count tests, below the declared floor of $min"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Upload coverage
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
        with:
          files: ./coverage.xml

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            mcp-server/go.sum
            cmd/team-cli/go.sum
            examples/go/go.sum

      # Spec 19 R19-10: enumerate modules from the repository rather than
      # assuming a go.work workspace (there is none). scripts/check_go_modules.py
      # is the fail-closed discovery gate: every go.mod in the tree MUST have a
      # row in .guardrails/test-floor.json and every row MUST name a module that
      # exists, so a newly added module cannot silently escape test/build/floor
      # CI. Run it before the loop that trusts the inventory.
      - name: Enforce Go module discovery (Spec 19 R19-10)
        run: |
          python3 scripts/check_go_modules.py --repo .
          python3 scripts/test_check_go_modules.py

      # Spec 19 R19-10: execute each Go module the discovery gate enumerated,
      # using the command the inventory declares for it (test and build), so
      # module coverage follows the tree, not a hardcoded step list. Spec 19
      # R19-12: every module also needs a discovered test count at or above its
      # declared positive floor. Zero tests or missing discovery is a failure,
      # never an implicit green default.
      - name: Test and build every enumerated Go module
        run: |
          set -euo pipefail
          INVENTORY=".guardrails/test-floor.json"
          mapfile -t ENTRIES < <(jq -c '.modules[]' "$INVENTORY")
          for entry in "${ENTRIES[@]}"; do
            path=$(jq -r '.path' <<< "$entry")
            min=$(jq -r '.min_tests' <<< "$entry")
            test_cmd=$(jq -r '.test_command' <<< "$entry")
            build_cmd=$(jq -r '.build_command' <<< "$entry")

            echo "::group::$path"
            echo "test:  $test_cmd"
            (cd "$path" && eval "$test_cmd")
            echo "build: $build_cmd"
            (cd "$path" && eval "$build_cmd")

            # go test -list prints one discovered Test function per line; a
            # discovery error or zero matches yields count=0, which the floor
            # comparison below then fails (deliberately fail-closed).
            listing=$(cd "$path" && go test -list '^Test' ./...)
            count=$(printf '%s\n' "$listing" | grep -c '^Test' || true)
            echo "$path: discovered $count tests (floor: $min)"
            if [ "$count" -lt "$min" ]; then
              echo "::error::Module $path discovered $count tests, below the declared floor of $min"
              exit 1
            fi
            echo "::endgroup::"
          done

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - name: Build CLI
        run: |
          cd cmd/team-cli
          make build

      - name: Upload CLI binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: team-cli
          path: cmd/team-cli/team

  # ---------------------------------------------------------------------------
  # Spec 19 Phase 0 security matrix (SPRINT-A4). One job per row gives a stable,
  # required-check name. Rows are added ONLY for suites that exist and pass;
  # every row drives the real middleware/endpoint, not a helper call. Suites not
  # yet implemented stay documented as NOT_RUN in
  # docs/sprints/SPRINT-A4-ci-security-gates.md rather than being faked here.
  # ---------------------------------------------------------------------------

  # R19-03 / R19-05: web middleware fail-closed on a configured-invalid
  # registry, plus registered/legacy authorization on the real REST surface.
  security-matrix-web-failclosed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Web fail-closed middleware + REST authorization row
        run: |
          cd mcp-server
          go test ./internal/web -run 'TestRegistryConfiguredInvalidDeniesAllProtectedTraffic|TestAPIKeyAuth' -count=1 -v

  # R19-03: MCP negative controls over the real StreamableHTTP endpoint
  # (allow AND deny + zero side effect) and the live revocation-propagation
  # bound driven through both the web and MCP httptest paths.
  security-matrix-mcp-fullpath-authz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: MCP full-path authz + live revocation bound row
        run: |
          cd mcp-server
          go test ./internal/mcp -run 'TestStreamableHTTP|TestLiveRevocationPropagationBound' -count=1 -v

  # R19-05: credential registry fail-closed and lifecycle rows.
  security-matrix-registry-failclosed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Registry fail-closed + lifecycle row
        run: |
          cd mcp-server
          go test ./internal/auth -run 'TestRegistry|TestRevocation|TestPermitsRestrictedOnly|TestSecretFile' -count=1 -v

  # R19-06: secret-leak / redaction row. Drives real paths (guardrail://config
  # resource read, an authorized tool call that persists a real audit decision,
  # and a denied error response) with a canary secret planted in every
  # secret-bearing config field and in tool arguments, and asserts the canary
  # never appears in logs, audit records, error responses, or serialized output.
  security-matrix-secret-redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Secret-leak / redaction row
        run: |
          cd mcp-server
          go test ./internal/mcp -run 'TestSecretLeakRedactionAcrossRealPaths|TestArgumentPrivacy|TestGuardrailConfigOmitsSecrets|TestConfigPublicViewOmitsSecrets|TestSafeResourceIDRejectsSecrets' -count=1 -v

      # Spec 17 R17-08 (redaction half): the request logger must not write a
      # query-string credential to logs. The raw RequestURI carried it in
      # cleartext; only the query is now withheld.
      - name: Request-log query redaction (Spec 17 R17-08)
        run: |
          cd mcp-server
          go test ./internal/middleware -run 'TestRedactRequestURI|TestRequestLoggerWithholdsQueryString' -count=1 -v

      # Spec 17 R17-08 (redaction half, delivery path): the webhook
      # delivery-failure log wrote the raw target URL and the transport error
      # (a *url.Error embedding the FULL URL), so a query-string credential
      # reached the log, the stored delivery row and the tool response. Only
      # the query is now withheld; scheme/host/path survive.
      - name: Webhook target-URL query redaction (Spec 17 R17-08)
        run: |
          cd mcp-server
          go test ./internal/notifications -run 'TestRedactURLsInText|TestWebhookDeliveryFailureLogWithholdsTargetQuery|TestWebhookTestEventErrorWithholdsTargetQuery' -count=1 -v

  # R19-07: webhook SSRF row. The dispatcher POSTs to the stored URL, so the
  # configuration-time URL guard must reject loopback, link-local (including
  # cloud metadata 169.254.169.254 and IPv4-mapped forms), private, and
  # unique-local destinations, and non-http(s) schemes, while accepting public
  # https. A policy-denied destination is the failed outcome.
  security-matrix-webhook-ssrf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Webhook URL SSRF guard row
        run: |
          cd mcp-server
          go test ./internal/mcp -run 'TestValidateWebhookURL' -count=1 -v

  # R19-08: client-IP trust boundary row (Spec 12 Sec. 3.4). With TRUSTED_PROXIES
  # unset the socket peer is the client IP and a forged X-Forwarded-For/
  # X-Real-IP/Forwarded header must not change the rate-limit key; a peer inside
  # a configured CIDR may supply the client IP; a malformed TRUSTED_PROXIES
  # entry fails config validation closed. Every assertion drives the real Echo
  # IPExtractor / config.Validate, not a helper call.
  security-matrix-clientip-trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Client-IP trust boundary row
        run: |
          cd mcp-server
          go test ./internal/clientip ./internal/web ./internal/config -run 'TestDefaultTrustsNoProxy|TestTrustedPeerHonoursForwarded|TestBareIPEntryTrusted|TestMalformedEntryFailsClosed|TestRateLimitKeyIgnoresForgedForwardedHeaders|TestTrustedProxyPeerUsesForwardedHeader|TestForwardedHeaderAnomalyMiddlewarePassesThrough|TestValidateTrustedProxiesStance' -count=1 -v

  # R19-08 (deployment/readiness half) / Spec 18 R18-07..R18-13: ordered
  # readiness and lifecycle contract. Every assertion drives the real ordered
  # evaluator and the real /health/ready handler: the checks run in the declared
  # order; STARTING/DRAINING/STOPPED are non-ready; a required probe that cannot
  # run is NOT_RUN (never PASS); a configured-but-invalid registry is non-ready
  # while an absent registry is skipped; a disabled or unexercised policy engine
  # is never an enforcement PASS; and evidence carries only bounded reason codes.
  security-matrix-readiness-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Readiness and lifecycle row
        run: |
          cd mcp-server
          go test ./internal/web -run 'TestReadinessReadyWhenAllChecksPass|TestLivenessIsLocalAndReadinessGatesTraffic|TestMissingProbeIsNotRunNeverPass|TestRegistryFailClosedButAbsentIsSkipped|TestPolicyHonesty|TestLifecycleDrainingAndStoppedAreNonReady|TestReadinessEvidenceIsBounded|TestHealthReadyHandlerStatusCodes' -count=1 -v

  # R19-08 / Spec 12 Sec. 3.3.2 + Sec. 3.3.4: CORS posture row. Production
  # wildcard/empty origins are a hard error, never a substitution
  # (EffectiveCORSOrigins); non-production substitutes restrictive localhost
  # defaults and reports the substitution. A CORS preflight is answered for a
  # DECLARED route only — an OPTIONS request whose matched route is the
  # catch-all file/SPA fallback is refused (404), so OPTIONS cannot declare an
  # arbitrary path. Every assertion drives the real router + middleware chain.
  security-matrix-cors-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: CORS posture and declared-preflight row
        run: |
          cd mcp-server
          go test ./internal/config ./internal/web -run 'TestEffectiveCORSOrigins|TestEffectiveCORSOriginsDoesNotAliasCaller|TestPreflightDeclaredRouteOnly|TestPreflightGuardLeavesNonOptionsUntouched' -count=1 -v

  # R19-08 / Spec 12 Sec. 3.1: declared exposure registry row. Every registered
  # route is enumerated from the REAL route table and must map to exactly one
  # exposure class; a route not declared public is authenticated (deny by
  # default); APIKeyAuth and RateLimitMiddleware derive their skip set from the
  # same registry; the static-asset rule stays method- and prefix-constrained.
  security-matrix-exposure-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Declared exposure registry row
        run: |
          cd mcp-server
          go test ./internal/web -run 'TestExposureRegistry' -count=1 -v

  # Spec 19 R19-09: static-asset bypass controls row. R19-09 names, verbatim,
  # "/api/ingest/evil.js, method variants, encoded/path-normalized forms, and
  # undeclared routes". This row drives the REAL route table + auth middleware
  # chain (the assembled production chain, not the middleware in isolation) and
  # proves every uncredentialed asset-shaped /api/ request is refused, that
  # encoded/path-normalized forms do not bypass, and that undeclared routes are
  # not served. Two positive controls keep the row non-vacuous.
  security-matrix-static-asset-bypass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Static-asset bypass controls row
        run: |
          cd mcp-server
          go test ./internal/web -run 'TestR1909' -count=1 -v

  # Spec 19 R19-09: Web UI shell path-confinement row. The /web/* SPA route is
  # declared public (Spec 12 Sec. 3.1 web-spa-fallback), so a request path must
  # never escape the web root. Proves an unauthenticated traversal
  # (/web/../<file>, encoded and double-encoded forms) cannot reach a file
  # outside the root, and that the shell and real assets still serve.
  security-matrix-spa-confinement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Web UI shell path-confinement row
        run: |
          cd mcp-server
          go test ./internal/web -run 'TestSPAHandler' -count=1 -v

  # Spec 16 R16-01/R16-04: declared resource permission matrix row. Proves every
  # registered guardrail:// resource has exactly one declared permission row
  # (matrix cannot fall behind the registry), that an undeclared resource denies,
  # and that a resource read is authorized by the same principal decision model
  # as a tool call over the real StreamableHTTP endpoint (allow AND deny).
  security-matrix-resource-permission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Resource permission matrix + per-resource authorization row
        run: |
          cd mcp-server
          go test ./internal/mcp -run 'TestResourcePolicyMatrixCoversEveryRegisteredResource|TestStreamableHTTPResourceReadAuthorization|TestAuthorizeResourceReadDeniesWithoutPrincipal' -count=1 -v

  # Spec 16 R16-08: decision/effect audit durability on the MCP transport. The
  # audit row read E(web) / NR(MCP) — the mechanism existed but was never
  # exercised over the real endpoint. This row drives the real StreamableHTTP
  # tools/call path with an admin credential and a real project fixture: when
  # the required durable record cannot be written the otherwise-authorized
  # mutation is denied AND leaves no effect, and with a durable store the
  # effect proceeds while an attributable record (principal, opaque credential
  # ID, action, outcome, reason code, policy version) is written — never a raw
  # key or hashAPIKey-as-identity.
  security-matrix-audit-durability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: MCP decision/effect audit durability row
        run: |
          cd mcp-server
          go test ./internal/mcp -run 'TestMCPAuditDurabilityFailsClosed|TestMCPAuditDurabilityRecorded' -count=1 -v

  # Spec 16 R16-09 (operator audit) / Spec 17 R17-10 (log opaque rotation
  # events): an applied credential-registry snapshot replacement or
  # verifier-key rotation must leave an attributable, opaque audit event. The
  # registry used to swap its whole snapshot on every reload/rotation with no
  # record at all, so an operator could neither confirm a rotation was applied
  # nor reconstruct when it happened. This row drives the real registry paths
  # (Reload / RotateVerifierKey) and the real audit logger: one applied
  # replacement emits exactly one opaque event (operation, key fingerprint,
  # counts, overlap), a no-op or rejected replacement emits nothing, and the
  # event never carries key material or a credential secret.
  security-matrix-rotation-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Credential rotation operator-audit row
        run: |
          cd mcp-server
          go test ./internal/auth -run 'TestRotationAudit' -count=1 -v
          go test ./internal/audit -run 'TestLogRotation' -count=1 -v

  # Spec 17 R17-10 (webhook half): staged signing-key rotation row. Proves a
  # staged replacement keeps the outgoing key valid only inside the bounded
  # overlap (and drops it once the window elapses), a cutover invalidates it
  # immediately, and every delivery identifies the active signing key to the
  # receiver by a non-reversible fingerprint without leaking the secret. Also
  # proves the applied rotation is recorded as an opaque audit event.
  security-matrix-webhook-rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Webhook signing-key rotation row
        run: |
          cd mcp-server
          go test ./internal/notifications -run 'TestWebhookSigningKey|TestWebhookRotation|TestWebhookKeyFingerprint|TestWebhookSigningHeaders' -count=1 -v
          go test ./internal/audit -run 'TestLogWebhookRotation' -count=1 -v

  # Spec 11 Sec. 4.5.2 / acceptance criterion 8: the legacy-acceptance removal
  # switch is testable on both transports. Before the deadline the legacy
  # shared key keeps its surface; once the deadline has passed it is refused
  # while a registered credential is unaffected; a malformed deadline fails
  # closed. Also proves accepted legacy use is counted (migration measured,
  # not assumed).
  security-matrix-legacy-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Legacy-acceptance removal switch row
        run: |
          cd mcp-server
          go test ./internal/config -run 'TestLegacyAcceptance|TestValidateRejectsMalformedLegacyDeadline' -count=1 -v
          go test ./internal/web -run 'TestAPIKeyAuth_LegacyAcceptanceRemovalSwitch' -count=1 -v
          go test ./internal/mcp -run 'TestRequireBearerWithPolicyLegacyRemovalSwitch' -count=1 -v

  # Spec 12 Sec. 3.6 / Spec 17 R17-03: security-headers row. Drives the real
  # middleware chain and asserts the deprecated X-XSS-Protection header is
  # never emitted, the headers that do the work are present, and HSTS is
  # emitted ONLY for a verified public HTTPS origin (TLS enabled + profile
  # `public`) — a header asserting an undeclared posture fails the row.
  security-matrix-security-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Security headers + HSTS posture row
        run: |
          cd mcp-server
          go test ./internal/web -run 'TestSecurityHeaders' -count=1 -v
          go test ./internal/config -run 'TestEmitsHSTS|TestHSTSHeaderValueIsBounded' -count=1 -v

  # Spec 17 R17-04: storage transit posture row. Proves DB/Redis transit is
  # coupled to the effective deployment profile — outside the isolated local
  # boundary a plaintext or unverified posture fails startup (verify-full DB,
  # Redis TLS required), while local keeps the isolated-bridge exception.
  security-matrix-storage-transit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Storage transit posture row
        run: |
          cd mcp-server
          go test ./internal/config -run 'TestValidateStorageTransit|TestValidateCouplesStorageTransitToProfile' -count=1 -v

  # Spec 17 R17-05: outside the local boundary, a production/nonlocal
  # deployment must reject known placeholder/default credentials (the shipped
  # Compose fallback is not a production credential).
  security-matrix-default-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Default-credential rejection row
        run: |
          cd mcp-server
          go test ./internal/config -run 'TestIsPlaceholderCredential|TestValidateNoProductionDefaultCredentials|TestValidateCouplesDefaultCredentialGateToProfile' -count=1 -v

  # Spec 17 R17-06: each primary secret (MCP/IDE key, JWT signing material,
  # DB/Redis password) may come from a read-only mounted secret file instead of
  # the environment, the file read is restricted to the service identity, and a
  # missing/permissive/empty file fails startup rather than starting with no
  # credential. The resolved value must still flow through the existing gates.
  security-matrix-secret-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Secret-source row
        run: |
          cd mcp-server
          go test ./internal/secretfile ./internal/config -run 'TestPermitsRestrictedOnly|TestReadAcceptsRestrictedFile|TestReadRejectsNonRegularAndPermissive|TestResolveSecretSourcesFromFiles|TestResolveSecretSourcesInlineWins|TestResolveSecretSourcesFailsClosed|TestValidateRequiresASecretSource|TestSecretFileSourceFeedsTheExistingGates|TestProviderKeysAcceptFileSources' -count=1 -v

  # Spec 17 R17-06: webhook signing material must be encrypted at rest. A
  # nonlocal/production deployment is required to supply a strong
  # WEBHOOK_ENCRYPTION_KEY (fail-closed), the store seals the signing key (and
  # its rotation-overlap predecessor) on write and decrypts on read, and a
  # sealed value read with no key configured — or a tampered one — is refused
  # rather than used as a signing key.
  security-matrix-webhook-atrest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Webhook signing-material at-rest encryption row
        run: |
          cd mcp-server
          go test ./internal/secretbox -count=1 -v
          go test ./internal/database -run 'TestWebhookScan|TestWebhookSeal|TestWebhookRotationEventFingerprint' -count=1 -v
          go test ./internal/config -run 'TestValidateWebhookEncryption|TestValidateCouplesWebhookEncryptionToStartup' -count=1 -v

  # Spec 17 R17-09: pprof stays disabled by default; when enabled for diagnosis
  # it must bind a loopback-only address, carry a bounded access window
  # (PPROF_UNTIL), and — outside the local profile — an explicit
  # no-proxy-route attestation. A misconfigured debug endpoint fails startup.
  security-matrix-debug-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Debug endpoint posture row
        run: |
          cd mcp-server
          go test ./internal/config -run 'TestPProfDeadline|TestValidateDebugEndpoint|TestDebugEndpointActive|TestValidateCouplesDebugPostureToStartup' -count=1 -v

  # Spec 17 R17-07: the credential-registry verifier key must carry real
  # entropy, not merely length — "a length check is not an entropy proof". A
  # key that clears the 16-character floor but has one distinct byte (e.g.
  # strings.Repeat("x", 64)) must be refused at both the config gate and the
  # registry load boundary; a nonlocal/production profile must clear >=256 bits.
  security-matrix-verifier-key-strength:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Verifier-key strength row
        run: |
          cd mcp-server
          go test ./internal/keymaterial ./internal/auth ./internal/config -run 'TestVerifierKeyEntropyBits|TestValidateVerifierKeyEntropyRejectsWeak|TestNewRejectsZeroEntropyVerifierKey|TestValidateCredentialVerifierKeyStrength|TestValidateCouplesVerifierKeyStrengthToStartup' -count=1 -v

  # Spec 17 R17-02: before starting a nonlocal listener the process must fail
  # closed on an unproven ingress posture. A `public` profile must present a
  # commit-bound preflight record proving TLS termination AND direct-backend
  # denial; a `tailnet` profile must prove verified private ingress AND encrypted
  # authenticated transport. A PRODUCTION_MODE flag, TLS_ENABLED or certificate
  # paths alone never satisfy the gate, and an operator JSON assertion with no
  # named positive/negative probe is not evidence.
  security-matrix-ingress-posture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Ingress posture row
        run: |
          cd mcp-server
          go test ./internal/config -run 'TestValidateIngressPosture|TestValidateIngressPostureRejectsWeakRecordFile|TestValidateCouplesIngressPostureToStartup|TestIngressPreflightPath' -count=1 -v

  # Spec 16 Sec. 4 R16-09 / Spec 17 R17-10: a registered credential must expire
  # within 90 days. The registry validates scopes, verifiers and the <=24h
  # rotation overlap, but the validity window itself was never checked: a
  # record with no expires_at was an unbounded grant, and a record could
  # declare an arbitrarily long window. Both are refused at the load boundary
  # (buildSnapshot), on the reload and rotation paths too, and the bound is
  # published so a silent change fails the build.
  security-matrix-credential-validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Credential validity bound row
        run: |
          cd mcp-server
          go test ./internal/auth -run 'TestRegistryRequiresExpiry|TestRegistryRejectsOverLongValidity|TestRegistryValidityWindowMeasuredFromIssuedAt|TestRegistryValidityBoundAppliesToReloadAndRotate|TestMaxCredentialValidityPublished' -count=1 -v

  # Spec 16 Sec. 4 R16-09: the credential lifecycle must define "approved key
  # generation, issuance, distinct principal assignment, expiry, overlap/
  # rotation, revocation" and must not claim a lifecycle API until one exists.
  # The registry could resolve, reload, rotate and revoke; nothing could ISSUE —
  # Digest() had one non-test caller (Resolve), so minting a credential meant
  # computing an HMAC by hand and hand-writing registry JSON the loader might
  # then reject at startup. This row drives the REAL issuer against the REAL
  # loader (LoadFromSources, the server's own entry point): an issued record
  # resolves to its principal, carries only the verifier, refuses an unknown
  # role / out-of-catalogue scope / unbounded validity, writes 0600 atomically,
  # refuses to write a set the loader would reject, and revokes to denial
  # inside the published 60s bound.
  security-matrix-credential-issuance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Credential issuance and authoring row
        run: |
          cd mcp-server
          go test ./internal/auth -run 'TestIssuedCredentialResolvesThroughTheRealRegistry|TestIssuedRecordCarriesNoSecret|TestIssueRefusesUnknownRoleAndEmptyScopes|TestIssueRefusesInvalidValidity|TestGenerateCredentialSecretIsRandomAndSized|TestRegistryFileRoundTripIsServerLoadable|TestWriteRegistryFileRefusesInvalidSet|TestWriteRegistryFileRefusesSymlink|TestRevokeInFileDeniesOnReload|TestLoadRegistryFileRefusesLooseMode' -count=1 -v

      - name: credctl builds and refuses a secret on argv
        run: |
          cd mcp-server
          go build ./cmd/credctl
          # No verifier key configured: the command must fail loudly rather than
          # mint anything against an empty key.
          if ./credctl list --registry /nonexistent.json; then
            echo "credctl accepted an invocation with no verifier key" >&2
            exit 1
          fi
          # An argv password flag must not exist at all (Spec 17 R17-08).
          if ./credctl issue --help 2>&1 | grep -qE '\-\-(secret|password|key)[ =]'; then
            echo "credctl exposes a secret-bearing argv flag" >&2
            exit 1
          fi

  # R19-04: mutation-kill control. Copies the module to a scratch directory,
  # confirms the real negative suite PASSES, injects a deterministic bypass
  # (webhook SSRF guard always permits; webhook egress policy always permits;
  # registry fail-closed swallows the load error; auth check always permits;
  # MCP tools/call always authorizes; secret fixture leaks into output; client
  # IP stance trusts every peer; readiness lifecycle gate removed; required
  # readiness probe failure swallowed; exposure registry always public;
  # exposure asset rule /api/ exclusion removed; HSTS emitted for a
  # non-public origin; resource-read authorization always permits; the
  # legacy-acceptance removal switch ignored; the default-credential gate always
  # permits; the secret-source requirement always satisfied; the debug-endpoint
  # posture gate always permits; the verifier-key entropy floor removed; the
  # ingress-posture gate always permits; the credential validity bound removed;
  # the credential issuance path writes an unvalidated registry; the MCP
  # required-audit gate removed),
  # and
  # requires
  # the SAME suite to FAIL —
  # proving the control detects the bypass. The scratch copy means the protected
  # tree is never left mutated. The docs-gate control runs the real link checker
  # (scripts/check-doc-links.sh) against a scratch tree and requires a broken
  # internal Markdown link to flip it PASS->FAIL.
  security-matrix-mutation-kill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Mutation-kill control row
        run: |
          cd mcp-server
          go test ./internal/mutationkill -count=1 -v

  # Spec 21 R21.1/R21.4/R21.5/R21.6: tool schema <-> handler conformance row.
  # R21.1 enumerates every registered tool from the live registry (parsed from
  # the package's own non-test Go sources, never a hand-maintained list); R21.2
  # compares each advertised InputSchema against the keys the matching dispatch
  # case actually reads, following package-local helper chains; R21.3 fails on
  # any drift that is not allowlisted with a tracked reason, and fails on a
  # stale allowlist entry. R21.5 forbids skipping, `continue-on-error` or a
  # relaxed threshold, so this row is a plain blocking job with no such keys.
  # R21.6 requires red-on-injected-drift and green-on-clean in the same
  # evidence turn: TestToolSchemaHandlerConformance is the green path over the
  # real registry and TestToolSchemaHandlerConformance_DetectsInjectedDrift is
  # the red path, both in this one invocation. Named as its own row so drift
  # fails CI with a spec-21 label rather than being buried inside `go test ./...`.
  security-matrix-tool-schema-handler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Tool schema/handler conformance row
        run: |
          cd mcp-server
          go test ./internal/mcp -run 'TestToolSchemaHandlerConformance' -count=1 -v

  # Spec 08 R08-4.3.6 — evidence retention, signing, access control and
  # auditable deletion. Named as its own row so a retention regression fails CI
  # with the requirement label instead of being buried inside `go test ./...`.
  # The row runs both halves in one invocation: the store's own acceptance suite
  # (round-trip, tamper refusal, retention sweep, count bound, audited erase,
  # promotion retention, divergent runs of one evaluation) and the config gate
  # that fails startup when the configured posture cannot meet the requirement.
  security-matrix-controlplane-evidence-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: mcp-server/go.sum

      - name: Control-plane evidence retention row
        run: |
          cd mcp-server
          go test ./internal/controlplane -run 'TestEvidenceStore|TestNewEvidenceStore|TestStoredRecord|TestPromoteRetainsItsAcceptanceEvidence|TestPromoteStatesWhenEvidenceIsNotRetained' -count=1 -v
          go test ./internal/config -run 'TestValidateAcceptsAnUnconfiguredEvidenceStore|TestValidateRefusesRetentionWithNoStore|TestValidateRefusesAStoreWithNoRetentionWindow|TestValidateEvidenceRetentionBounds|TestValidateEvidenceRetentionCouplesSigningToProfile|TestValidateCouplesEvidenceRetentionToStartup' -count=1 -v
          go test ./internal/mcp -run 'TestControlPlaneResourceReportsEvidenceRetention|TestControlPlaneResourceOmitsRetentionWhenUnconfigured' -count=1 -v
