name: Hosted portability probe
on:
  push:
    branches: [codex/ci-hosted-probe]
permissions:
  contents: read
jobs:
  validate:
    name: Validate candidate on GitHub-hosted Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 6d6b55eeaf738ce3d9169dee80509cd91e145e50
          fetch-depth: 1
          persist-credentials: false
      - name: Check out approved AIGGP
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: TheArchitectit/AIGGP-Agentic-Framework
          ref: 7d17d6f1baa4357110e57d3a6ffd55fbacdd77f7
          path: .devgate
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: mcp-server/go.mod
          cache: false
      - name: Install Python test dependencies
        run: python3 -m pip install pytest pytest-cov PyYAML
      - name: Probe hosted runner isolation
        run: |
          python3 scripts/runner_isolation_probe.py --workspace "$GITHUB_WORKSPACE" --sha 6d6b55eeaf738ce3d9169dee80509cd91e145e50 --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/runner-isolation.json"
          python3 scripts/check_runner_isolation.py --repo . --attestation "$RUNNER_TEMP/runner-isolation.json"
      - name: Run local validation entry point
        run: scripts/run_local_ci.sh
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
