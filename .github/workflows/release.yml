# Create the GitHub Release from an annotated version tag. This workflow is
# idempotent: scripts/deploy.sh may already have created the release. An
# existing release is evidence; a create failure with no release is fatal.
name: Release Published

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish the tagged release
    # Fleet-routed like every other workflow in this repo. The R19-13
    # least-privilege rule applies to team-validation-fleet.yml's trusted job;
    # this publisher legitimately needs `contents: write` to create the release.
    # `devgate` matched no runner this repo registers and left the publisher
    # queued forever, so the label is the repo's own `guardrails-ucs03`.
    runs-on: [self-hosted, Linux, X64, guardrails-ucs03]
    steps:
      - name: Checkout the tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0

      - name: Publish and verify the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # actions/checkout can leave a local tag ref that resolves straight
          # to a commit even when the pushed ref is annotated. Fetch the tag
          # object itself before asserting annotation; do not weaken the check.
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a semantic version tag"
            exit 1
          fi
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::$TAG is not annotated"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$TAG^{commit}")" ]; then
            echo "::error::checkout HEAD and $TAG resolve to different commits"
            exit 1
          fi
          if [ -f VERSION ] && [ "$(tr -d '[:space:]' < VERSION)" != "${TAG#v}" ]; then
            echo "::error::VERSION disagrees with $TAG"
            exit 1
          fi

          python3 - "$TAG" "$RUNNER_TEMP/release-notes.md" <<'PY'
          import pathlib, sys
          tag, output = sys.argv[1:]
          version = tag[1:]
          heading = f"## [{version}]"
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          notes, found = [], False
          for line in lines:
              if line.strip() == heading or line.strip().startswith(heading + " - "):
                  if found:
                      raise SystemExit(f"duplicate release heading: {heading}")
                  found = True
                  continue
              if found and line.startswith("## ["):
                  break
              if found:
                  notes.append(line)
          body = "\n".join(notes).strip()
          if not found:
              raise SystemExit(f"CHANGELOG.md has no {heading} section")
          if not body:
              raise SystemExit(f"{heading} has no release notes; an empty release is not evidence")
          pathlib.Path(output).write_text(body + "\n", encoding="utf-8")
          print(f"release notes: {len(body.splitlines())} line(s) from {heading}")
          PY

          # Publishing goes straight to the REST API: the UCS03 runner image
          # ships the Actions runner and the gate toolchain but no `gh`
          # binary, and this job failed with exit 127 the first time it ran
          # here. urllib keeps the same idempotent contract — an existing
          # release is success, a create is followed by a read-back so the
          # URL that is printed is one the API actually serves.
          python3 - "$TAG" "$RUNNER_TEMP/release-notes.md" <<'PY'
          import json, os, sys, urllib.error, urllib.request
          tag, notes_file = sys.argv[1:]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}/releases"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": f"{repo}-release-workflow",
          }

          def call(request):
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def existing(url):
              try:
                  return call(urllib.request.Request(url, headers=headers))
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise SystemExit(
                      f"release lookup failed: HTTP {error.code} " + error.read().decode("utf-8", "replace")
                  )

          release = existing(f"{api}/tags/{tag}")
          if release:
              print(f"{tag} already has a GitHub Release; leaving its notes editable by maintainers")
          else:
              body = open(notes_file, encoding="utf-8").read()
              payload = json.dumps(
                  {"tag_name": tag, "name": tag, "body": body, "draft": False, "prerelease": False}
              ).encode("utf-8")
              request = urllib.request.Request(
                  api, data=payload, headers={**headers, "Content-Type": "application/json"}, method="POST"
              )
              try:
                  call(request)
              except urllib.error.HTTPError as error:
                  # A concurrent publisher (scripts/deploy.sh) may win the race;
                  # 422 already_exists is success here, anything else is fatal.
                  if error.code != 422 or "already_exists" not in error.read().decode("utf-8", "replace"):
                      raise SystemExit(f"release create failed: HTTP {error.code}")
          verified = existing(f"{api}/tags/{tag}")
          if not verified:
              raise SystemExit(f"::error::{tag} has no GitHub Release after publish")
          print(verified["html_url"])
          PY
