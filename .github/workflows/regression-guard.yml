name: Regression Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

jobs:
  regression-check:
    runs-on: ubuntu-latest
    name: Check for Potential Regressions

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Action pinning (Spec 19 R19-15 / Spec 17 R17-11)
        run: |
          # A mutable tag silently changes the code that runs with the job token;
          # a full commit SHA does not. Fail-closed, non-vacuous (see the gate).
          python scripts/check_action_pins.py --repo .
          python scripts/test_check_action_pins.py

      - name: MCP resource claims (Spec 16 R16-01 / Spec 08 R08-4.2.5)
        run: |
          # Two independent assertions: the documented resource COUNT must match
          # the declared registry, and every guardrail:// URI the README lists as
          # an MCP resource must actually be registered. On 2026-10-18 the README
          # advertised 11 resources (live: 12 at the time) and named
          # guardrail://quick-reference, which is a web route, not a resource.
          # The tool-count gate could not see either fault: it counts tools and
          # compares numbers only.
          python scripts/check_resource_claims.py --repo .
          python scripts/test_check_resource_claims.py

      - name: Image-digest pinning (Spec 19 R19-15 / Spec 17 R17-11)
        run: |
          # A floating image tag silently changes what runs in production;
          # an immutable @sha256 digest does not. The committed image-pins.json
          # is the reviewed record the manifests must agree with.
          python scripts/check_image_pins.py --repo .
          python scripts/test_check_image_pins.py

      - name: Secret-free process (Spec 17 R17-08)
        run: |
          # A credential in argv (``redis-cli -a`` / ``--requirepass``) is
          # visible in docker/podman inspect and /proc/<pid>/cmdline and leaks
          # to logs. Fail-closed, non-vacuous (see the gate).
          python scripts/check_secret_argv.py --repo .
          python scripts/test_check_secret_argv.py

      - name: Secret inventory coverage (Spec 17 R17-10)
        run: |
          # Every secret-bearing environment name in the tree must have an
          # inventory row (owner/consumer/source/expiry/rotation/revocation),
          # and no row may carry a pasted value. Fail-closed, non-vacuous.
          python scripts/check_secret_inventory.py --repo .
          python scripts/test_check_secret_inventory.py

      - name: Go module discovery (Spec 19 R19-10)
        run: |
          # Spec 19 R19-10 requires the package gate to ENUMERATE modules from
          # the repository rather than assume a go.work workspace. Every go.mod
          # in the tree must have a row in .guardrails/test-floor.json (and every
          # row must name a module that exists), so a new module cannot escape
          # test/build/floor CI. Fail-closed, non-vacuous.
          python scripts/check_go_modules.py --repo .
          python scripts/test_check_go_modules.py

      - name: Python test discovery (Spec 19 R19-10)
        run: |
          # Spec 19 R19-10 also requires running Python tests. Every directory
          # holding a collectable test_*.py / *_test.py must have a row in
          # .guardrails/python-test-floor.json (and every row must name an
          # existing suite), so a new Python suite cannot escape the Python run.
          # Fail-closed, non-vacuous.
          python scripts/check_python_tests.py --repo .
          python scripts/test_check_python_tests.py

      - name: Runner trust and repository isolation (Spec 19 R19-13)
        run: |
          # Spec 19 R19-13: fork code must never reach the private runner, the
          # self-hosted label may appear only in the trusted-main workflow, and
          # that job must declare least-privilege permissions, bounded
          # concurrency and post-job cleanup. A runner label alone is not
          # isolation evidence (the host probe runs in that job and the record
          # is validated there). Fail-closed, non-vacuous: zero workflows, zero
          # pull_request workflows and zero self-hosted jobs each FAIL rather
          # than pass on an empty set.
          python -m pip install --quiet pyyaml
          python scripts/check_runner_isolation.py --repo .
          python scripts/test_check_runner_isolation.py

      - name: Tool manifest counts (F001)
        run: |
          # F001: documented tool counts must equal the registries in source.
          # The previous form of this gate matched one prose phrase; a doc
          # rewrite made it match nothing and it exited 0 while the counts
          # were wrong. This one counts from the Go registries and treats a
          # claim site that stops matching as a FAILURE, not a skip.
          python scripts/check_tool_count.py --repo .
          python scripts/test_check_tool_count.py

      - name: Policy-pack lock record (Spec 07 R07-4.1 / R07-5.8)
        run: |
          # Spec 07 requires CI to verify that the checked-in lock record
          # matches the declared pack revisions and content digests. The
          # verifier that existed for this (`scripts/validate-policy-packs.mjs`)
          # was invoked by no workflow at all, and passed with exit 0 on a tree
          # with zero packs because its expected-lock loop iterated over
          # nothing. This one fails on an empty discovery, on an unreadable or
          # unrecognised lock record, and on any byte/version drift, and it
          # requires every rule's `tool` to be a tool the server registers.
          python scripts/check_policy_pack_lock.py --repo .
          python scripts/test_check_policy_pack_lock.py

      - name: Run Regression Check
        id: regression_check
        run: |
          echo "::group::Regression Check Output"
          # Spec 19 R19-02: nonzero exits must fail the step, never be swallowed.
          python scripts/regression_check.py --all --json > regression_report.json
          python scripts/regression_check.py --all
          echo "::endgroup::"

      - name: Analyze PR for Bug Fix Commits
        id: check_bug_fixes
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking for bug fix commits..."

          # Get commit messages in PR
          git log --format=%s "origin/${{ github.base_ref }}..HEAD" > commit_messages.txt

          # Check for conventional commit bug fix markers
          BUG_FIX_COUNT=$(grep -cE "^(fix|bugfix|hotfix)(\(.+\))?:" commit_messages.txt || true)

          echo "bug_fix_count=$BUG_FIX_COUNT" >> $GITHUB_OUTPUT

          if [ "$BUG_FIX_COUNT" -gt 0 ]; then
            echo "Detected $BUG_FIX_COUNT bug fix commit(s)"
            echo "commits=$(cat commit_messages.txt)" >> $GITHUB_OUTPUT
          fi

      - name: Check for Regression Tests
        id: check_regression_tests
        if: steps.check_bug_fixes.outputs.bug_fix_count > 0
        run: |
          echo "Checking for regression tests in tests/regression/..."

          # Check if tests/regression/ directory exists and has new files
          if [ -d "tests/regression" ]; then
            NEW_REGRESSION_TESTS=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}..HEAD" -- "tests/regression/**" | wc -l)
            echo "new_regression_tests=$NEW_REGRESSION_TESTS" >> $GITHUB_OUTPUT

            if [ "$NEW_REGRESSION_TESTS" -eq 0 ]; then
              echo "::warning::Bug fix commits detected but no new regression tests found in tests/regression/"
              echo "Consider adding a regression test for the bug fix."
            else
              echo "Found $NEW_REGRESSION_TESTS new regression test(s)"
            fi
          else
            echo "new_regression_tests=0" >> $GITHUB_OUTPUT
            echo "::warning::tests/regression/ directory not found"
          fi

      - name: Check Failure Registry
        id: check_registry
        run: |
          REGISTRY_FILE=".guardrails/failure-registry.jsonl"

          if [ -f "$REGISTRY_FILE" ]; then
            ACTIVE_FAILURES=$(grep -v "^#" "$REGISTRY_FILE" | grep '"status":"active"' | wc -l)
            echo "active_failures=$ACTIVE_FAILURES" >> $GITHUB_OUTPUT
            echo "Found $ACTIVE_FAILURES active failure(s) in registry"
          else
            echo "active_failures=0" >> $GITHUB_OUTPUT
            echo "No failure registry found"
          fi

      - name: Check Modified Files Against Registry
        id: check_modified_files
        if: github.event_name == 'pull_request'
        run: |
          # Get list of modified files
          MODIFIED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}..HEAD")

          if [ -f ".guardrails/failure-registry.jsonl" ]; then
            echo "Checking modified files against failure registry..."

            HIGH_RISK_FILES=""
            for file in $MODIFIED_FILES; do
              # Check if file appears in any active failure entry
              MATCHES=$(grep -v "^#" .guardrails/failure-registry.jsonl | \
                       grep '"status":"active"' | \
                       grep "\"$file\"" | \
                       jq -r '.failure_id' 2>/dev/null || true)

              if [ -n "$MATCHES" ]; then
                HIGH_RISK_FILES="$HIGH_RISK_FILES\n- $file (related to: $MATCHES)"
              fi
            done

            if [ -n "$HIGH_RISK_FILES" ]; then
              echo "high_risk_files<<EOF" >> $GITHUB_OUTPUT
              echo -e "$HIGH_RISK_FILES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');

            let report = '## Regression Guard Report\n\n';

            // Active failures count
            const activeFailures = '${{ steps.check_registry.outputs.active_failures }}';
            report += `### Failure Registry Status\n`;
            report += `- **Active failures in registry:** ${activeFailures}\n\n`;

            // Bug fix commits
            const bugFixCount = parseInt('${{ steps.check_bug_fixes.outputs.bug_fix_count }}' || '0');
            report += `### Bug Fix Detection\n`;
            if (bugFixCount > 0) {
              report += `⚠️ **${bugFixCount} bug fix commit(s) detected**\n\n`;

              // Regression tests check
              const newTests = parseInt('${{ steps.check_regression_tests.outputs.new_regression_tests }}' || '0');
              if (newTests === 0) {
                report += `🔴 **Warning:** No new regression tests found in \`tests/regression/\`\n`;
                report += `> Bug fixes should include regression tests to prevent reintroduction.\n\n`;
              } else {
                report += `✅ ${newTests} new regression test(s) added\n\n`;
              }
            } else {
              report += `✅ No bug fix commits detected\n\n`;
            }

            // High risk files
            const highRiskFiles = `${{ steps.check_modified_files.outputs.high_risk_files }}`;
            if (highRiskFiles && highRiskFiles !== 'undefined') {
              report += `### ⚠️ Files with Known Bug History\n`;
              report += `The following modified files have active failures in the registry:\n`;
              report += highRiskFiles + '\n\n';
              report += `> Please review the failure registry before merging.\n\n`;
            }

            // Prevention rules status
            if (fs.existsSync('.guardrails/prevention-rules/pattern-rules.json')) {
              const rules = JSON.parse(fs.readFileSync('.guardrails/prevention-rules/pattern-rules.json', 'utf8'));
              const enabledRules = rules.rules.filter(r => r.enabled).length;
              report += `### Prevention Rules\n`;
              report += `- ${enabledRules} pattern rule(s) active\n\n`;
            }

            report += `---\n`;
            report += `*Run \`python scripts/regression_check.py\` locally for detailed output.*\n`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Regression Guard Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }

      - name: Fail on Critical Issues
        if: github.event_name == 'pull_request'
        run: |
          # Check if any critical patterns were matched
          if [ -f "regression_report.json" ]; then
            CRITICAL_COUNT=$(cat regression_report.json | jq '[.issues[].violations[] | select(.severity == "critical")] | length')

            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "::error::$CRITICAL_COUNT critical regression pattern(s) detected!"
              echo "Review the regression check output above."
              exit 1
            fi
          fi

          # Fail if bug fix (fix:/bugfix:/hotfix:) without regression test.
          # Spec 19 R19-02: a warning cannot represent a missing security
          # assertion — bug-fix commits require a new regression test.
          BUG_FIX_COUNT=${{ steps.check_bug_fixes.outputs.bug_fix_count || 0 }}
          NEW_TESTS=${{ steps.check_regression_tests.outputs.new_regression_tests || 0 }}

          if [ "$BUG_FIX_COUNT" -gt 0 ] && [ "$NEW_TESTS" -eq 0 ]; then
            echo "::error::Bug fix commits detected but no new regression tests found in tests/regression/."
            echo "Add a regression test for the fix, or (PRs only) justify an exemption in the PR description and split the fix into a separate PR."
            exit 1
          fi

          exit 0
